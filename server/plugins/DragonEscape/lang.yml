archer-lore:
  - "&fWherever you land the arrow,"
  - "&fyou will be teleported."
brewer-lore:
  - "&fStart with 2 random splash potions,"
  - "&fand get new random ones every 15 seconds!"
  - '&f"I like that kit because'
  - "&fI like to see the world burn and"
  - '&fhaving a kit this based on rng would be funny."'
  - "&f-Wind2Earth"
digger-lore:
  - "&fYou can left click with Diamond Pickaxe"
  - "&fto break blocks instantly"
  - "&fYou can then place them."
  - "&fUses: 6"
disruptor-lore:
  - "&fRight clicking your Axe makes you"
  - "&flunge forward in the direction you are looking."
  - "&fIt has 3 uses."
  - "&fReceive 1 TNT every 10 seconds."
  - "&fMaximum of 2 TNTs."
  - "&fRight Click with TNT to throw mine."
  - "&fWhen stepped on, it creates a mini explosion."
furnace-lore:
  - "&fEvery 5 seconds a new slot in your inventory empties,"
  - "&fallowing you to mine or place a new block!"
leap-lore:
  - "&fRight click your Axe to lunge into the air"
  - "&fwherever you're looking."
leap-vertical-lore:
  - "&fOriginal Mineplex Dragon Escape leap."
  - "&fRight click your Axe to leap where you look."
  - "&fFour charges with an 8 second cooldown."
auto-rejoin-lore:
  - "&fToggles whether you want to lock this map for this session."
  - "&fWhen toggled on you will automatically"
  - "&frejoin this map after finishing."
none-lore:
  - "&fJust classic good old parkour!"
toggle-join-messages-lore:
  - "&fToggle whether you want to see"
  - "&fthe join message every time you join a map."
toggle-reward-messages-lore:
  - "&fToggle whether you want to see"
  - "&fthis message every time you finish a map."
toggle-reset-messages-lore:
  - "&fToggle whether you would like to see"
  - "&fthe timer reset message every time you reset a run."
toggle-display-timer-lore:
  - "&fToggle whether you want to display"
  - "&fthe timer in your action bar."
toggle-player-visibility-lore:
  - "&fToggle whether you want to see other players."
toggle-sound-effects-lore:
  - "&fNot implemented yet"
toggle-safety-mode-lore:
  - "&fToggle whether you want to use"
  - "&fsafety mode during this run."
  - "&fWhen toggled on, you have to confirm actions"
  - "&fsuch as leaving and resetting."
